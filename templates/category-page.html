<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{headTitle}} — {{siteName}}</title>
  <meta name="description" content="{{metaDescription}}">
  <link rel="canonical" href="{{canonicalUrl}}">
  <link rel="alternate" type="application/rss+xml" title="{{siteName}}" href="{{siteUrl}}/feed.xml">
  {{socialMeta}}
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    /* === Critical CSS — Category Page === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      color: var(--color-text);
      background-color: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: var(--color-link);
      text-decoration: none;
      transition: color var(--transition-base);
    }
    a:hover { color: var(--color-link-hover); }
    a:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    img { max-width: 100%; height: auto; display: block; }

    /* --- Header / Nav --- */
    .site-header {
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-4) var(--space-8);
    }
    .header-inner {
      max-width: var(--width-nav);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-logo {
      font-family: var(--font-heading);
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: var(--color-text);
    }
    .site-logo:hover { color: var(--color-accent); }
    .site-nav { display: flex; gap: var(--space-6); list-style: none; }
    .site-nav a {
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--color-text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .site-nav a:hover { color: var(--color-accent); }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: var(--space-2);
      color: var(--color-text);
    }
    .nav-toggle svg { width: 24px; height: 24px; }

    /* --- Category Layout --- */
    .category-layout {
      max-width: var(--width-grid);
      margin: 0 auto;
      padding: 0 var(--space-8);
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-8);
    }

    /* --- Category Header --- */
    .category-header {
      padding: var(--space-12) 0 var(--space-8);
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--space-8);
    }
    .category-header h1 {
      font-family: var(--font-heading);
      font-size: var(--text-h1);
      line-height: var(--leading-heading);
      margin-bottom: var(--space-4);
    }
    .category-header p {
      font-size: var(--text-lg);
      color: var(--color-text-muted);
      max-width: var(--width-article);
    }
    .category-post-count {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-top: var(--space-4);
    }

    /* --- Posts Grid --- */
    .posts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-8);
    }
    .post-card {
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: box-shadow var(--transition-base);
    }
    .post-card:hover { box-shadow: var(--shadow-md); }
    .post-card-img {
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--color-bg-alt);
    }
    .post-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .post-card-body { padding: var(--space-6); }
    .post-card-title {
      font-family: var(--font-heading);
      font-size: var(--text-h3);
      line-height: var(--leading-heading);
      margin-bottom: var(--space-3);
    }
    .post-card-title a {
      color: var(--color-text);
    }
    .post-card-title a:hover { color: var(--color-accent); }
    .post-card-excerpt {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-4);
    }
    .post-card-meta {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      display: flex;
      gap: var(--space-4);
    }

    /* --- Related Categories Sidebar --- */
    .related-categories {
      padding: var(--space-8);
      background: var(--color-bg-alt);
      border-radius: var(--radius-md);
      align-self: start;
    }
    .related-categories h2 {
      font-family: var(--font-heading);
      font-size: var(--text-base);
      margin-bottom: var(--space-6);
    }
    .related-categories ul {
      list-style: none;
    }
    .related-categories li {
      margin-bottom: var(--space-3);
    }
    .related-categories a {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-2) 0;
      border-bottom: 1px solid var(--color-border);
      transition: color var(--transition-base);
    }
    .related-categories a:hover { color: var(--color-accent); }
    .related-categories .cat-count {
      font-size: var(--text-xs);
      background: var(--color-bg);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-full);
    }

    /* --- Footer --- */
    .site-footer {
      border-top: 1px solid var(--color-border);
      padding: var(--space-12) var(--space-8);
      margin-top: var(--space-16);
    }
    .footer-inner {
      max-width: var(--width-nav);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-6);
      text-align: center;
    }
    .footer-links {
      display: flex;
      gap: var(--space-6);
      list-style: none;
      flex-wrap: wrap;
      justify-content: center;
    }
    .footer-links a {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    .footer-links a:hover { color: var(--color-accent); }
    .footer-copy {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    /* --- Tablet (768px+) --- */
    @media (min-width: 768px) {
      .posts-grid { grid-template-columns: repeat(2, 1fr); }
      .footer-inner {
        flex-direction: row;
        justify-content: space-between;
        text-align: left;
      }
    }

    /* --- Desktop (1024px+) --- */
    @media (min-width: 1024px) {
      .category-layout {
        grid-template-columns: 1fr 280px;
        gap: var(--space-12);
      }
      .category-header { padding: var(--space-16) 0 var(--space-8); }
      .category-header h1 { font-size: 2.8rem; }
      .posts-grid { grid-template-columns: repeat(2, 1fr); }
      .related-categories {
        position: sticky;
        top: var(--space-8);
      }
    }

    /* --- Mobile --- */
    @media (max-width: 767px) {
      .site-header { padding: var(--space-4); }
      .nav-toggle { display: block; }
      .site-nav {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--color-bg);
        border-bottom: 1px solid var(--color-border);
        flex-direction: column;
        padding: var(--space-4);
        gap: var(--space-4);
      }
      .site-nav.is-open { display: flex; }
      .site-header { position: relative; }
      .category-layout { padding: 0 var(--space-4); }
      .category-header {
        padding: var(--space-8) 0;
      }
      .category-header h1 { font-size: 2rem; }
      .site-footer { padding: var(--space-8) var(--space-4); }
    }

    /* --- Print --- */
    @media print {
      .site-header, .site-footer, .related-categories { display: none; }
      body { background: white; color: black; }
    }
  </style>
  {{jsonLd}}
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="site-logo" aria-label="{{siteName}} — Inicio">{{siteName}}</a>
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'false');document.querySelector('.site-nav').classList.toggle('is-open')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <nav>
        <ul class="site-nav" role="navigation" aria-label="Navegación principal">
          <li><a href="/blog/">Blog</a></li>
          <li><a href="/blog/">Categorías</a></li>
          <li><a href="/sobre/">Sobre</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="category-layout">

      <!-- Main Content -->
      <div>
        <!-- Category Header -->
        <header class="category-header">
          <h1>{{category}}</h1>
          <p>{{categoryDescription}}</p>
          <p class="category-post-count">{{postCount}} artículos</p>
        </header>

        <!-- Posts Grid -->
        <div class="posts-grid">
          {{posts}}
        </div>
      </div>

      <!-- Related Categories Sidebar -->
      <aside class="related-categories" aria-label="Otras categorías">
        <h2>Otras categorías</h2>
        <ul>
          {{relatedCategories}}
        </ul>
      </aside>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-copy">&copy; 2007–2026 {{siteName}}. Todos los derechos reservados.</p>
      <ul class="footer-links">
        <li><a href="/blog/">Blog</a></li>
        <li><a href="/blog/">Categorías</a></li>
        <li><a href="/sobre/">Sobre</a></li>
        <li><a href="/feed.xml" aria-label="RSS Feed">RSS</a></li>
      </ul>
    </div>
  </footer>

  <!-- Analytics: Add tracking code here -->
  <!-- Cloudflare Web Analytics will be configured in CF dashboard -->
</body>
</html>
