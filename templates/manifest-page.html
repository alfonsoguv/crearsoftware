<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sobre Crear Software — {{siteName}}</title>
  <meta name="description" content="{{metaDescription}}">
  <link rel="canonical" href="{{canonicalUrl}}">
  <link rel="alternate" type="application/rss+xml" title="{{siteName}}" href="{{siteUrl}}/feed.xml">
  {{socialMeta}}
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    /* === Critical CSS — Manifest Page === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      color: var(--color-text);
      background-color: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: var(--color-link);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
      transition: color var(--transition-base);
    }
    a:hover { color: var(--color-link-hover); }
    a:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: var(--radius-md);
    }

    /* --- Header / Nav --- */
    .site-header {
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-4) var(--space-8);
    }
    .header-inner {
      max-width: var(--width-nav);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-logo {
      font-family: var(--font-heading);
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: var(--color-text);
      text-decoration: none;
    }
    .site-logo:hover { color: var(--color-accent); }
    .site-nav { display: flex; gap: var(--space-6); list-style: none; }
    .site-nav a {
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--color-text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-decoration: none;
    }
    .site-nav a:hover { color: var(--color-accent); }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: var(--space-2);
      color: var(--color-text);
    }
    .nav-toggle svg { width: 24px; height: 24px; }

    /* --- Manifest Content --- */
    .manifest {
      max-width: var(--width-article);
      margin: 0 auto;
      padding: var(--space-16) var(--space-8);
    }
    .manifest h1 {
      font-family: var(--font-heading);
      font-size: var(--text-h1);
      line-height: var(--leading-heading);
      margin-bottom: var(--space-10);
      text-align: center;
    }
    .manifest-content h2 {
      font-family: var(--font-heading);
      font-size: var(--text-h2);
      line-height: var(--leading-heading);
      margin-top: var(--space-12);
      margin-bottom: var(--space-6);
    }
    .manifest-content h3 {
      font-family: var(--font-heading);
      font-size: var(--text-h3);
      line-height: var(--leading-heading);
      margin-top: var(--space-10);
      margin-bottom: var(--space-4);
    }
    .manifest-content p {
      margin-bottom: var(--space-6);
    }
    .manifest-content ul, .manifest-content ol {
      margin-bottom: var(--space-6);
      padding-left: var(--space-6);
    }
    .manifest-content li {
      margin-bottom: var(--space-2);
    }
    .manifest-content blockquote {
      margin: var(--space-10) 0;
      padding: var(--space-8);
      border-left: 3px solid var(--color-accent);
      background: var(--color-bg-alt);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      font-family: var(--font-heading);
      font-size: var(--text-lg);
      font-style: italic;
      line-height: var(--leading-heading);
    }
    .manifest-content blockquote p:last-child { margin-bottom: 0; }
    .manifest-content hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: var(--space-12) 0;
    }
    .manifest-content strong { font-weight: var(--weight-bold); }
    .manifest-content em { font-style: italic; }

    /* --- Footer --- */
    .site-footer {
      border-top: 1px solid var(--color-border);
      padding: var(--space-12) var(--space-8);
      margin-top: var(--space-16);
    }
    .footer-inner {
      max-width: var(--width-nav);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-6);
      text-align: center;
    }
    .footer-links {
      display: flex;
      gap: var(--space-6);
      list-style: none;
      flex-wrap: wrap;
      justify-content: center;
    }
    .footer-links a {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-decoration: none;
    }
    .footer-links a:hover { color: var(--color-accent); }
    .footer-copy {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    /* --- Tablet (768px+) --- */
    @media (min-width: 768px) {
      .footer-inner {
        flex-direction: row;
        justify-content: space-between;
        text-align: left;
      }
    }

    /* --- Desktop (1024px+) --- */
    @media (min-width: 1024px) {
      .manifest { padding: var(--space-24) var(--space-8); }
      .manifest h1 { font-size: 3rem; }
    }

    /* --- Mobile --- */
    @media (max-width: 767px) {
      .site-header { padding: var(--space-4); }
      .nav-toggle { display: block; }
      .site-nav {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--color-bg);
        border-bottom: 1px solid var(--color-border);
        flex-direction: column;
        padding: var(--space-4);
        gap: var(--space-4);
      }
      .site-nav.is-open { display: flex; }
      .site-header { position: relative; }
      .manifest {
        padding: var(--space-10) var(--space-4);
      }
      .manifest h1 { font-size: 2rem; }
      .site-footer { padding: var(--space-8) var(--space-4); }
    }

    /* --- Print --- */
    @media print {
      .site-header, .site-footer { display: none; }
      body { background: white; color: black; font-size: 12pt; }
      .manifest { padding: 0; }
    }
  </style>
  {{jsonLd}}
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="site-logo" aria-label="{{siteName}} — Inicio">{{siteName}}</a>
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'false');document.querySelector('.site-nav').classList.toggle('is-open')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <nav>
        <ul class="site-nav" role="navigation" aria-label="Navegación principal">
          <li><a href="/blog/">Blog</a></li>
          <li><a href="/blog/">Categorías</a></li>
          <li><a href="/sobre/">Sobre</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <article class="manifest">
      <h1>Sobre Crear Software</h1>
      <div class="manifest-content">
        {{content}}
      </div>
    </article>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-copy">&copy; 2007–2026 {{siteName}}. Todos los derechos reservados.</p>
      <ul class="footer-links">
        <li><a href="/blog/">Blog</a></li>
        <li><a href="/blog/">Categorías</a></li>
        <li><a href="/sobre/">Sobre</a></li>
        <li><a href="/feed.xml" aria-label="RSS Feed">RSS</a></li>
      </ul>
    </div>
  </footer>

  <!-- Analytics: Add tracking code here -->
  <!-- Cloudflare Web Analytics will be configured in CF dashboard -->
</body>
</html>
