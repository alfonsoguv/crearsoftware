<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{headTitle}} — {{siteName}}</title>
  <meta name="description" content="{{metaDescription}}">
  <link rel="canonical" href="{{canonicalUrl}}">
  <link rel="alternate" type="application/rss+xml" title="{{siteName}}" href="{{siteUrl}}/feed.xml">
  {{socialMeta}}
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    /* === Critical CSS — Guide Page === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      color: var(--color-text);
      background-color: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: var(--color-link);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
      transition: color var(--transition-base);
    }
    a:hover { color: var(--color-link-hover); }
    a:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: var(--radius-md);
    }

    /* --- Header / Nav --- */
    .site-header {
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-4) var(--space-8);
    }
    .header-inner {
      max-width: var(--width-nav);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-logo {
      font-family: var(--font-heading);
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: var(--color-text);
      text-decoration: none;
    }
    .site-logo:hover { color: var(--color-accent); }
    .site-nav { display: flex; gap: var(--space-6); list-style: none; }
    .site-nav a {
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--color-text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-decoration: none;
    }
    .site-nav a:hover { color: var(--color-accent); }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: var(--space-2);
      color: var(--color-text);
    }
    .nav-toggle svg { width: 24px; height: 24px; }

    /* --- Guide Layout --- */
    .guide-layout {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 var(--space-8);
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-8);
    }

    /* --- TOC Sidebar --- */
    .toc-sidebar {
      display: none;
    }
    .toc-mobile {
      margin-bottom: var(--space-8);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .toc-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: var(--space-4);
      background: var(--color-bg-alt);
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--color-text);
    }
    .toc-toggle svg {
      width: 16px;
      height: 16px;
      transition: transform var(--transition-base);
    }
    .toc-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
    .toc-content {
      display: none;
      padding: var(--space-4);
    }
    .toc-content.is-open { display: block; }
    .toc-content ul { list-style: none; padding-left: var(--space-4); }
    .toc-content > ul { padding-left: 0; }
    .toc-content li { margin-bottom: var(--space-2); }
    .toc-content a {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-decoration: none;
    }
    .toc-content a:hover { color: var(--color-accent); }

    /* --- Guide Header --- */
    .guide-header {
      padding: var(--space-12) 0 var(--space-8);
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--space-10);
    }
    .guide-badge {
      display: inline-block;
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-accent);
      background: rgba(179, 90, 43, 0.1);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      margin-bottom: var(--space-4);
      text-decoration: none;
    }
    .guide-header h1 {
      font-family: var(--font-heading);
      font-size: var(--text-h1);
      line-height: var(--leading-heading);
      margin-bottom: var(--space-4);
    }
    .guide-header p {
      font-size: var(--text-lg);
      color: var(--color-text-muted);
      margin-bottom: var(--space-4);
      max-width: var(--width-article);
    }
    .guide-meta {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    /* --- Guide Content --- */
    .guide-content {
      max-width: var(--width-guide);
    }
    .guide-content h2 {
      font-family: var(--font-heading);
      font-size: var(--text-h2);
      line-height: var(--leading-heading);
      margin-top: var(--space-12);
      margin-bottom: var(--space-6);
    }
    .guide-content h3 {
      font-family: var(--font-heading);
      font-size: var(--text-h3);
      line-height: var(--leading-heading);
      margin-top: var(--space-10);
      margin-bottom: var(--space-4);
    }
    .guide-content p { margin-bottom: var(--space-6); }
    .guide-content ul, .guide-content ol {
      margin-bottom: var(--space-6);
      padding-left: var(--space-6);
    }
    .guide-content li { margin-bottom: var(--space-2); }
    .guide-content blockquote {
      margin: var(--space-8) 0;
      padding: var(--space-6) var(--space-8);
      border-left: 3px solid var(--color-accent);
      background: var(--color-bg-alt);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      font-style: italic;
    }
    .guide-content blockquote p:last-child { margin-bottom: 0; }
    .guide-content code {
      font-family: var(--font-code);
      font-size: 0.9em;
      background: var(--color-code-bg);
      padding: 0.1em 0.3em;
      border-radius: var(--radius-sm);
    }
    .guide-content pre {
      margin: var(--space-8) 0;
      padding: var(--space-6);
      background: var(--color-code-bg);
      border-radius: var(--radius-md);
      overflow-x: auto;
      border: 1px solid var(--color-border);
    }
    .guide-content pre code {
      background: none;
      padding: 0;
      font-size: var(--text-sm);
      line-height: 1.6;
    }
    .guide-content img {
      margin: var(--space-8) 0;
      box-shadow: var(--shadow-sm);
    }
    .guide-content table {
      width: 100%;
      margin: var(--space-8) 0;
      border-collapse: collapse;
    }
    .guide-content th, .guide-content td {
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--color-border);
      text-align: left;
    }
    .guide-content th {
      background: var(--color-bg-alt);
      font-weight: var(--weight-medium);
      font-size: var(--text-sm);
    }
    .guide-content hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: var(--space-10) 0;
    }

    /* --- Internal Links Section --- */
    .related-articles {
      margin-top: var(--space-16);
      padding-top: var(--space-12);
      border-top: 1px solid var(--color-border);
    }
    .related-articles h2 {
      font-family: var(--font-heading);
      font-size: var(--text-h2);
      margin-bottom: var(--space-8);
    }
    .related-articles-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-4);
    }
    .related-article-link {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-6);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      text-decoration: none;
      transition: border-color var(--transition-base), box-shadow var(--transition-base);
    }
    .related-article-link:hover {
      border-color: var(--color-accent);
      box-shadow: var(--shadow-sm);
    }
    .related-article-link .arrow {
      color: var(--color-accent);
      flex-shrink: 0;
    }
    .related-article-link span {
      color: var(--color-text);
      font-weight: var(--weight-medium);
    }

    /* --- Footer --- */
    .site-footer {
      border-top: 1px solid var(--color-border);
      padding: var(--space-12) var(--space-8);
      margin-top: var(--space-16);
    }
    .footer-inner {
      max-width: var(--width-nav);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-6);
      text-align: center;
    }
    .footer-links {
      display: flex;
      gap: var(--space-6);
      list-style: none;
      flex-wrap: wrap;
      justify-content: center;
    }
    .footer-links a {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-decoration: none;
    }
    .footer-links a:hover { color: var(--color-accent); }
    .footer-copy {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    /* --- Tablet (768px+) --- */
    @media (min-width: 768px) {
      .related-articles-list { grid-template-columns: repeat(2, 1fr); }
      .footer-inner {
        flex-direction: row;
        justify-content: space-between;
        text-align: left;
      }
    }

    /* --- Desktop (1024px+) --- */
    @media (min-width: 1024px) {
      .guide-layout {
        grid-template-columns: 220px 1fr;
        gap: var(--space-12);
      }
      .toc-mobile { display: none; }
      .toc-sidebar {
        display: block;
        position: sticky;
        top: var(--space-8);
        align-self: start;
        max-height: calc(100vh - 4rem);
        overflow-y: auto;
      }
      .toc-sidebar h2 {
        font-family: var(--font-body);
        font-size: var(--text-xs);
        font-weight: var(--weight-medium);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--color-text-muted);
        margin-bottom: var(--space-4);
      }
      .toc-sidebar ul { list-style: none; padding-left: 0; }
      .toc-sidebar ul ul { padding-left: var(--space-4); }
      .toc-sidebar li { margin-bottom: var(--space-2); }
      .toc-sidebar a {
        font-size: var(--text-sm);
        color: var(--color-text-muted);
        text-decoration: none;
        transition: color var(--transition-base);
      }
      .toc-sidebar a:hover { color: var(--color-accent); }
      .guide-header { padding: var(--space-16) 0 var(--space-8); }
      .guide-header h1 { font-size: 2.8rem; }
    }

    /* --- Mobile --- */
    @media (max-width: 767px) {
      .site-header { padding: var(--space-4); }
      .nav-toggle { display: block; }
      .site-nav {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--color-bg);
        border-bottom: 1px solid var(--color-border);
        flex-direction: column;
        padding: var(--space-4);
        gap: var(--space-4);
      }
      .site-nav.is-open { display: flex; }
      .site-header { position: relative; }
      .guide-layout { padding: 0 var(--space-4); }
      .guide-header {
        padding: var(--space-8) 0;
      }
      .guide-header h1 { font-size: 2rem; }
      .site-footer { padding: var(--space-8) var(--space-4); }
    }

    /* --- Print --- */
    @media print {
      .site-header, .site-footer, .toc-sidebar, .toc-mobile, .related-articles { display: none; }
      body { background: white; color: black; font-size: 12pt; }
    }
  </style>
  {{jsonLd}}
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="site-logo" aria-label="{{siteName}} — Inicio">{{siteName}}</a>
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'false');document.querySelector('.site-nav').classList.toggle('is-open')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <nav>
        <ul class="site-nav" role="navigation" aria-label="Navegación principal">
          <li><a href="/blog/">Blog</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="guide-layout">

      <!-- TOC Sidebar (Desktop) -->
      <aside class="toc-sidebar" aria-label="Tabla de contenidos">
        <h2>Contenido</h2>
        {{toc}}
      </aside>

      <!-- Guide Content Area -->
      <article>
        <!-- TOC Mobile -->
        <div class="toc-mobile">
          <button class="toc-toggle" aria-expanded="false" onclick="var c=this.nextElementSibling;c.classList.toggle('is-open');this.setAttribute('aria-expanded',c.classList.contains('is-open'))">
            <span>Tabla de contenidos</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="toc-content">
            {{toc}}
          </div>
        </div>

        <!-- Guide Header -->
        <header class="guide-header">
          <span class="guide-badge">Guía</span>
          <h1>{{title}}</h1>
          <p>{{description}}</p>
          <p class="guide-meta">Última actualización: <time datetime="{{date}}">{{dateFormatted}}</time></p>
        </header>

        <!-- Content -->
        <div class="guide-content">
          {{content}}
        </div>

        <!-- Related Articles -->
        <section class="related-articles" aria-label="Artículos relacionados">
          <h2>Artículos relacionados</h2>
          <div class="related-articles-list">
            {{relatedPosts}}
          </div>
        </section>
      </article>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-copy">&copy; 2007–2026 {{siteName}}. Todos los derechos reservados.</p>
      <ul class="footer-links">
        <li><a href="/blog/">Blog</a></li>
        <li><a href="/feed.xml" aria-label="RSS Feed">RSS</a></li>
        <li><a href="/llms.txt" aria-label="Indice para agentes de IA">llms.txt</a></li>
      </ul>
    </div>
  </footer>

  <!-- Analytics: Add tracking code here -->
  <!-- Cloudflare Web Analytics will be configured in CF dashboard -->
</body>
</html>
