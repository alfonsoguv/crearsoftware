<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog — {{siteName}}</title>
  <meta name="description" content="{{metaDescription}}">
  <link rel="canonical" href="{{canonicalUrl}}">
  <link rel="alternate" type="application/rss+xml" title="{{siteName}}" href="{{siteUrl}}/feed.xml">
  {{socialMeta}}
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    /* === Critical CSS — Blog Index === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      color: var(--color-text);
      background-color: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: var(--color-link);
      text-decoration: none;
      transition: color var(--transition-base);
    }
    a:hover { color: var(--color-link-hover); }
    a:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    img { max-width: 100%; height: auto; display: block; }

    /* --- Header / Nav --- */
    .site-header {
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-4) var(--space-8);
    }
    .header-inner {
      max-width: var(--width-nav);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-logo {
      font-family: var(--font-heading);
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: var(--color-text);
    }
    .site-logo:hover { color: var(--color-accent); }
    .site-nav { display: flex; gap: var(--space-6); list-style: none; }
    .site-nav a {
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--color-text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .site-nav a:hover { color: var(--color-accent); }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: var(--space-2);
      color: var(--color-text);
    }
    .nav-toggle svg { width: 24px; height: 24px; }

    /* --- Page Header --- */
    .page-header {
      max-width: var(--width-grid);
      margin: 0 auto;
      padding: var(--space-12) var(--space-8) var(--space-8);
    }
    .page-header h1 {
      font-family: var(--font-heading);
      font-size: var(--text-h1);
      line-height: var(--leading-heading);
    }

    /* --- Category Filter --- */
    .category-filter {
      max-width: var(--width-grid);
      margin: 0 auto;
      padding: 0 var(--space-8) var(--space-8);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .category-pills {
      display: flex;
      gap: var(--space-3);
      list-style: none;
      white-space: nowrap;
    }
    .category-pill {
      display: inline-block;
      padding: var(--space-2) var(--space-4);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--color-text-muted);
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      transition: all var(--transition-base);
      text-decoration: none;
    }
    .category-pill:hover, .category-pill.is-active {
      color: var(--color-white);
      background: var(--color-accent);
      border-color: var(--color-accent);
    }
    .category-pill:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    /* --- Posts List --- */
    .posts-list {
      max-width: var(--width-grid);
      margin: 0 auto;
      padding: 0 var(--space-8);
    }
    .post-item {
      padding: var(--space-8) 0;
      border-bottom: 1px solid var(--color-border);
    }
    .post-item:first-child { padding-top: 0; }
    .post-item-category {
      display: inline-block;
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-secondary);
      margin-bottom: var(--space-3);
    }
    .post-item h2 {
      font-family: var(--font-heading);
      font-size: var(--text-h3);
      line-height: var(--leading-heading);
      margin-bottom: var(--space-3);
    }
    .post-item h2 a {
      color: var(--color-text);
    }
    .post-item h2 a:hover { color: var(--color-accent); }
    .post-item-excerpt {
      color: var(--color-text-muted);
      font-size: var(--text-base);
      margin-bottom: var(--space-4);
      max-width: var(--width-article);
    }
    .post-item-meta {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      display: flex;
      gap: var(--space-4);
    }

    /* --- Pagination --- */
    .pagination {
      max-width: var(--width-grid);
      margin: 0 auto;
      padding: var(--space-12) var(--space-8);
      display: flex;
      justify-content: center;
      gap: var(--space-2);
    }
    .pagination a, .pagination span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      height: 40px;
      padding: 0 var(--space-3);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      transition: all var(--transition-base);
    }
    .pagination a:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    .pagination .is-current {
      background: var(--color-accent);
      color: var(--color-white);
      border-color: var(--color-accent);
    }

    /* --- Footer --- */
    .site-footer {
      border-top: 1px solid var(--color-border);
      padding: var(--space-12) var(--space-8);
      margin-top: var(--space-8);
    }
    .footer-inner {
      max-width: var(--width-nav);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-6);
      text-align: center;
    }
    .footer-links {
      display: flex;
      gap: var(--space-6);
      list-style: none;
      flex-wrap: wrap;
      justify-content: center;
    }
    .footer-links a {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    .footer-links a:hover { color: var(--color-accent); }
    .footer-copy {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    /* --- Tablet (768px+) --- */
    @media (min-width: 768px) {
      .footer-inner {
        flex-direction: row;
        justify-content: space-between;
        text-align: left;
      }
    }

    /* --- Desktop (1024px+) --- */
    @media (min-width: 1024px) {
      .page-header { padding: var(--space-16) var(--space-8) var(--space-8); }
      .post-item h2 { font-size: var(--text-h2); }
    }

    /* --- Mobile --- */
    @media (max-width: 767px) {
      .site-header { padding: var(--space-4); }
      .nav-toggle { display: block; }
      .site-nav {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--color-bg);
        border-bottom: 1px solid var(--color-border);
        flex-direction: column;
        padding: var(--space-4);
        gap: var(--space-4);
      }
      .site-nav.is-open { display: flex; }
      .site-header { position: relative; }
      .page-header { padding: var(--space-8) var(--space-4); }
      .category-filter { padding: 0 var(--space-4) var(--space-6); }
      .posts-list { padding: 0 var(--space-4); }
      .pagination { padding: var(--space-8) var(--space-4); }
      .site-footer { padding: var(--space-8) var(--space-4); }
    }

    /* --- Print --- */
    @media print {
      .site-header, .site-footer, .category-filter, .pagination { display: none; }
      body { background: white; color: black; }
    }
  </style>
  {{jsonLd}}
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="site-logo" aria-label="{{siteName}} — Inicio">{{siteName}}</a>
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'false');document.querySelector('.site-nav').classList.toggle('is-open')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <nav>
        <ul class="site-nav" role="navigation" aria-label="Navegación principal">
          <li><a href="/blog/">Blog</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <!-- Page Header -->
    <div class="page-header">
      <h1>Blog</h1>
    </div>

    <!-- Category Filter -->
    <nav class="category-filter" aria-label="Filtrar por categoría">
      <ul class="category-pills">
        <li><a href="/blog/" class="category-pill is-active">Todos</a></li>
        {{categoryFilters}}
      </ul>
    </nav>

    <!-- Posts List -->
    <div class="posts-list">
      {{posts}}
    </div>

    <!-- Pagination -->
    <nav class="pagination" aria-label="Paginación">
      {{pagination}}
    </nav>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-copy">&copy; 2007–2026 {{siteName}}. Todos los derechos reservados.</p>
      <ul class="footer-links">
        <li><a href="/blog/">Blog</a></li>
        <li><a href="/feed.xml" aria-label="RSS Feed">RSS</a></li>
      </ul>
    </div>
  </footer>

  <!-- Analytics: Add tracking code here -->
  <!-- Cloudflare Web Analytics will be configured in CF dashboard -->
</body>
</html>
