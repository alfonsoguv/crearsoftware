name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      # cloudflare/pages-action fue retirada de GitHub (falló el 20-sep-2026);
      # wrangler-action es la sustituta oficial. --branch=main fuerza producción.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=crearsoftware --branch=main

      # Un despliegue verde no garantiza que el sitio funcione: el 20-sep-2026
      # wrangler borro el binding KV de produccion y /api/bots y /api/subscribe
      # estuvieron seis dias en 503 con Actions en verde todo el tiempo.
      - name: Comprobar la salud de produccion
        run: |
          sleep 45   # margen para que Cloudflare promocione el despliegue
          node scripts/healthcheck-prod.mjs https://crearsoftware.com
